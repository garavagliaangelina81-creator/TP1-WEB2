spring.application.name=api-blanck

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/webii_tp2}
spring.datasource.username=${DB_USERNAME:webii_tp2}
spring.datasource.password=${DB_PASSWORD:webii_tp2}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
app.dummyjson.base-url=https://dummyjson.com

server.port=${PORT:8080}

app.jwt.secret=${JWT_SECRET:dev-secret-solo-para-local-cambiar-en-produccion-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration