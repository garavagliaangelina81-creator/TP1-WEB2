
services:
  postgres:
    image: postgres:17
    container_name: webii-tp2
    environment:
      POSTGRES_DB: webii_tp2
      POSTGRES_USER: webii_tp2
      POSTGRES_PASSWORD: webii_tp2
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: